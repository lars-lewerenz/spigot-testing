# Message for /greet <name>. '&' starts a color code, %name% is replaced by the name.
greeting: '&aHello, %name%!'
# Sent to every player who joins, in the chat and as a title.
welcome: '&eWelcome, %name%!'
welcome-title: '&6Welcome!'
welcome-subtitle: '&eHave fun, %name%'
# Sent after the welcome: to players who have never joined before, and to everyone else.
first-visit: '&bNice to meet you, %name%!'
return-visit: '&bGood to see you again, %name%!'
# Cancel every creeper spawn.
block-creepers: true
# Skip the night: set the time back to morning whenever it gets dark.
lock-day: true
# Players with these names are turned away at login.
banned-names: [Herobrine]
banned-name-message: '&cThe name %name% is not allowed here.'
# Players who write one of these words are kicked.
kick-words: [grief]
kick-message: '&cNo griefing, %name%!'
