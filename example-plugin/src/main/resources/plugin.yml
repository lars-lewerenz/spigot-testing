name: Greeter
version: '1.0.0'
main: io.github.larslewerenz.greeter.GreeterPlugin
api-version: '1.13'
description: Example plugin for spigot-testing
softdepend: [PlaceholderAPI]
commands:
  greet:
    description: Greets someone
    usage: /<command> <name>
  menu:
    description: Opens the greeter menu
    usage: /<command>
  rules:
    description: Shows the server rules from the files in plugins/Greeter/rules/
    usage: /<command>
