name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test the framework
        run: ./gradlew -p framework build
      - name: Build the example, run its unit tests
        run: ./gradlew :example-plugin:test :example-plugin:serverTestHarnessJar
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ matrix.os }}
          path: |
            framework/*/build/reports/tests/
            example-plugin/build/reports/tests/

  server-tests:
    name: Server tests
    needs: build
    # Running a Minecraft server requires accepting the Minecraft EULA
    # (https://aka.ms/MinecraftEULA). Server tests run only once the repository
    # variable ACCEPT_MINECRAFT_EULA is set to "true".
    if: vars.ACCEPT_MINECRAFT_EULA == 'true'
    uses: ./.github/workflows/server-tests.yml
    with:
      # Core servers: the oldest, one per Java generation and the newest, and two on Windows.
      # compatibility.yml covers every major version.
      servers: >-
        [{"server": "Spigot", "version": "1.8.8"},
         {"server": "Spigot", "version": "1.12.2"},
         {"server": "Spigot", "version": "1.20.4"},
         {"server": "Spigot", "version": "1.21.11"},
         {"server": "Spigot", "version": "26.3"},
         {"server": "Paper", "version": "1.8.8"},
         {"server": "Paper", "version": "1.21.11"},
         {"server": "Paper", "version": "26.3"},
         {"server": "Spigot", "version": "1.8.8", "os": "windows-latest"},
         {"server": "Paper", "version": "26.3", "os": "windows-latest"}]
