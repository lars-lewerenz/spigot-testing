# Keeps dependencies and GitHub Actions up to date. Most versions live in gradle/libs.versions.toml.
# New Minecraft versions usually need MCProtocolLib and ViaProxy updates: those get their own
# pull request, since they matter most for compatibility.
version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - "/"           # the root build and gradle/libs.versions.toml
      - "/framework"  # the framework build (plugins it applies)
    schedule:
      interval: weekly
      day: monday
    # Don't propose versions published in the last week: compromised releases are usually
    # found and pulled within days.
    cooldown:
      default-days: 7
    ignore:
      # Compatibility floors, chosen on purpose: plugins compile against the oldest API they
      # support, so the same jar runs on every newer server.
      - dependency-name: "org.spigotmc:spigot-api"
      - dependency-name: "io.papermc.paper:paper-api"
      # JUnit 6+ needs Java 17, but the test runtime runs inside servers on Java 8 (1.8.8 - 1.16.5).
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
    groups:
      bots:
        patterns:
          - "org.geysermc.mcprotocollib:*"
          - "net.raphimc:ViaProxy"
      libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "org.geysermc.mcprotocollib:*"
          - "net.raphimc:ViaProxy"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Don't propose versions published in the last week: compromised releases are usually
    # found and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
